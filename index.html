<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>端末チェック（OS・NFC確認）</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Meiryo", sans-serif;
    margin: 0;
    padding: 20px;
    background: #f4f6f8;
    color: #1f2937;
    line-height: 1.6;
  }
  .card {
    max-width: 560px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: 14px;
    padding: 22px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
  }
  h1 {
    font-size: 1.35rem;
    margin: 0 0 12px 0;
  }
  .badge {
    display: inline-block;
    padding: 8px 14px;
    border-radius: 8px;
    font-weight: bold;
    font-size: 1.1rem;
    margin-bottom: 14px;
  }
  .ok { background: #dcfce7; color: #166534; border: 2px solid #22c55e; }
  .warn { background: #fef9c3; color: #854d0e; border: 2px solid #eab308; }
  .ng { background: #fee2e2; color: #991b1b; border: 2px solid #ef4444; }
  .info-box {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 12px 14px;
    margin: 14px 0;
    font-size: 0.95rem;
  }
  .btn-group {
    display: flex;
    gap: 10px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  button {
    flex: 1;
    min-width: 120px;
    padding: 12px 14px;
    font-size: 1rem;
    font-weight: bold;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    background: #ffffff;
    color: #111827;
    cursor: pointer;
  }
  button.active {
    background: #2563eb;
    color: #ffffff;
    border-color: #2563eb;
  }
  .note {
    font-size: 0.85rem;
    color: #4b5563;
    margin-top: 14px;
    word-break: break-all;
  }
</style>
</head>
<body>
<div class="card">
  <h1>スマホ対応チェック</h1>
  <div id="resultBadge" class="badge">判定中...</div>
  <div id="resultDetail" class="info-box"></div>

  <div id="nfcPrompt" class="info-box" style="display:none;">
    <strong>AndroidのNFC（マイナカード読取）確認：</strong><br>
    端末の「設定」で<strong>NFC</strong>が有効か、または本体裏面に<strong>おサイフケータイマーク</strong>があるか確認してください。
    <div class="btn-group">
      <button id="btnNfcYes" onclick="setNfc('yes')">NFCあり</button>
      <button id="btnNfcNo" onclick="setNfc('no')">NFCなし / 不明</button>
    </div>
  </div>

  <div class="note" id="uaInfo"></div>
</div>

<script>
(function() {
  const ua = navigator.userAgent || "";
  const isDesktopModeMac = (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1) || /Macintosh/i.test(ua);
  const hasRealIPadToken = /iPad/i.test(ua);
  const hasRealIPhoneToken = /iPhone|iPod/i.test(ua);
  const isAppleTouchDevice = hasRealIPhoneToken || hasRealIPadToken || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/i.test(ua);

  // iOS / iPadOS の表記ゆれ・バージョン抽出（ブラウザ報告値のため目安）
  let iosVerText = null;
  const osMatch = ua.match(/(?:CPU\s+(?:iPhone\s+)?OS|OS)\s+([0-9]+(?:_[0-9]+)*)/i);
  if (osMatch && isAppleTouchDevice) {
    iosVerText = osMatch[1].replace(/_/g, ".");
  }

  let androidVer = null;
  if (isAndroid) {
    const m = ua.match(/Android\s+([0-9]+(?:\.[0-9]+)?)/i);
    if (m) androidVer = parseFloat(m[1]);
  }

  // 古い機能の有無
  const supportsWebAuthn = typeof window.PublicKeyCredential !== "undefined";
  const supportsInert = "inert" in HTMLElement.prototype;
  const likelyLegacyApple = isAppleTouchDevice && (!supportsWebAuthn || !supportsInert);

  let androidNfcChoice = null;

  window.setNfc = function(val) {
    androidNfcChoice = val;
    document.getElementById("btnNfcYes").classList.toggle("active", val === "yes");
    document.getElementById("btnNfcNo").classList.toggle("active", val === "no");
    render();
  };

  function getAppleLabel() {
    if (hasRealIPadToken) return "iPad（PC版表示の可能性あり・要確認）";
    if (isDesktopModeMac && navigator.maxTouchPoints > 1) {
      return "iPhoneまたはiPad（デスクトップ表示／タッチ端末・要確認）";
    }
    if (hasRealIPhoneToken) return "iPhone";
    return "iOS端末（要確認）";
  }

  function render() {
    const badge = document.getElementById("resultBadge");
    const detail = document.getElementById("resultDetail");
    const nfcPrompt = document.getElementById("nfcPrompt");
    const uaInfo = document.getElementById("uaInfo");

    badge.className = "badge";

    if (isAppleTouchDevice) {
      nfcPrompt.style.display = "none";
      const deviceLabel = getAppleLabel();
      const verDisp = iosVerText ? ("iOS / iPadOS " + iosVerText + "（目安）") : "バージョン非表示・目安確認";

      if (likelyLegacyApple) {
        badge.classList.add("warn");
        badge.textContent = "【要確認】OS・ブラウザ機能を確認";
        detail.innerHTML =
          "<strong>端末種別：</strong>" + deviceLabel + "<br>" +
          "<strong>OS目安：</strong>" + verDisp + "<br>" +
          "<strong>案内：</strong>「設定 ＞ 一般 ＞ 情報 / ソフトウェアアップデート」を確認してください。Safariの「AA / 表示」からモバイル表示への切替もご確認ください。";
      } else {
        badge.classList.add("ok");
        badge.textContent = "【案内目安】iOS端末（対応候補）";
        detail.innerHTML =
          "<strong>端末種別：</strong>" + deviceLabel + "<br>" +
          "<strong>OS目安：</strong>" + verDisp + "<br>" +
          "<strong>NFC：</strong>iPhone 7以降であれば搭載（機種により確認）<br>" +
          "<strong>案内：</strong>必要に応じて「設定 ＞ 一般 ＞ 情報」で正確なiOSバージョンをご確認ください。";
      }
    } else if (isAndroid) {
      nfcPrompt.style.display = "block";
      const verText = androidVer ? ("Android " + androidVer + "（目安）") : "Android（バージョン不明）";
      if (androidNfcChoice === "no") {
        badge.classList.add("ng");
        badge.textContent = "【要注意】NFC非搭載・未確認";
        detail.innerHTML =
          "<strong>OS目安：</strong>" + verText + "<br>" +
          "<strong>NFC：</strong>なし / 未確認<br>" +
          "<strong>案内：</strong>マイナンバーカード読取にはNFC対応が必要です。代替案内を確認してください。";
      } else if (androidVer !== null && androidVer < 10) {
        badge.classList.add("warn");
        badge.textContent = "【要確認】Androidバージョンが古めです";
        detail.innerHTML =
          "<strong>OS目安：</strong>" + verText + "<br>" +
          "<strong>NFC：</strong>" + (androidNfcChoice === "yes" ? "あり" : "未選択") + "<br>" +
          "<strong>案内：</strong>OSアップデート可否とNFC有無を確認してください。";
      } else if (androidNfcChoice === "yes") {
        badge.classList.add("ok");
        badge.textContent = "【案内目安】Android（NFC確認済）";
        detail.innerHTML =
          "<strong>OS目安：</strong>" + verText + "<br>" +
          "<strong>NFC：</strong>あり<br>" +
          "<strong>案内：</strong>そのまま受付・サポートへお進みください。";
      } else {
        badge.classList.add("warn");
        badge.textContent = "【確認中】NFCの有無をタップしてください";
        detail.innerHTML =
          "<strong>OS目安：</strong>" + verText + "<br>" +
          "<strong>NFC：</strong>下のボタンで選択してください";
      }
    } else {
      nfcPrompt.style.display = "none";
      badge.classList.add("warn");
      badge.textContent = "【要確認】スマホの標準ブラウザで開いてください";
      detail.innerHTML = "PCまたはアプリ内ブラウザから開かれています。iPhone/AndroidのSafariやChromeで読み取ってください。";
    }

    uaInfo.textContent = "識別情報: " + ua;
  }

  render();
})();
</script>
</body>
</html>
