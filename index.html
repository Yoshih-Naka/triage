<!DOCTYPE html>
<!-- スマホ対応チェックツール v5.0 (汎用・画面ロック確認先頭行追加版) -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>端末チェック v5.0（OS・NFC確認）</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Meiryo", sans-serif;
    margin: 0;
    padding: 20px;
    background: #f4f6f8;
    color: #1f2937;
    line-height: 1.6;
  }
  .card {
    max-width: 560px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: 14px;
    padding: 22px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
  }
  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
    gap: 8px;
  }
  h1 {
    font-size: 1.35rem;
    margin: 0;
  }
  .ver-tag {
    font-size: 0.8rem;
    font-weight: bold;
    color: #4b5563;
    background: #e5e7eb;
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge {
    display: inline-block;
    padding: 10px 16px;
    border-radius: 10px;
    font-weight: bold;
    font-size: 1.15rem;
    margin-bottom: 14px;
  }
  .ok { background: #dcfce7; color: #166534; border: 2px solid #22c55e; }
  .warn { background: #fef9c3; color: #854d0e; border: 2px solid #eab308; }
  .ng { background: #fee2e2; color: #991b1b; border: 2px solid #ef4444; }
  .info-box {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 12px 14px;
    margin: 14px 0;
    font-size: 0.95rem;
  }
  .lock-gate {
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 12px;
  }
  .lock-status {
    margin-top: 8px;
    font-size: 0.9rem;
    font-weight: bold;
    color: #1e3a8a;
  }
  .btn-group {
    display: flex;
    gap: 10px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  button {
    flex: 1;
    min-width: 120px;
    padding: 10px 12px;
    font-size: 0.95rem;
    font-weight: bold;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    background: #ffffff;
    color: #111827;
    cursor: pointer;
  }
  button.active {
    background: #2563eb;
    color: #ffffff;
    border-color: #2563eb;
  }
  .note {
    font-size: 0.82rem;
    color: #4b5563;
    margin-top: 14px;
    word-break: break-all;
  }
</style>
</head>
<body>
<div class="card">
  <div class="header-row">
    <h1>スマホ対応チェック</h1>
    <span class="ver-tag">v5.0</span>
  </div>
  <div id="resultBadge" class="badge">判定中...</div>
  <div id="resultDetail" class="info-box"></div>

  <div id="nfcPrompt" class="info-box" style="display:none;">
    <strong>AndroidのNFC（カード読取）確認：</strong><br>
    端末の「設定」で<strong>NFC</strong>が有効か、または本体裏面に<strong>おサイフケータイマーク</strong>があるか確認してください。
    <div class="btn-group">
      <button id="btnNfcYes" onclick="setNfc('yes')">NFCあり</button>
      <button id="btnNfcNo" onclick="setNfc('no')">NFCなし / 不明</button>
    </div>
  </div>

  <div class="note" id="uaInfo"></div>
</div>

<script>
(function() {
  const APP_VERSION = "v5.0";
  const ua = navigator.userAgent || "";
  const isDesktopModeMac = (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1) || /Macintosh/i.test(ua);
  const hasRealIPadToken = /iPad/i.test(ua);
  const hasRealIPhoneToken = /iPhone|iPod/i.test(ua);
  const isAppleTouchDevice = hasRealIPhoneToken || hasRealIPadToken || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/i.test(ua);

  // iOS / iPadOS の表記ゆれ・バージョン抽出（ブラウザ報告値のため目安）
  let iosVerText = null;
  const osMatch = ua.match(/(?:CPU\s+(?:iPhone\s+)?OS|OS)\s+([0-9]+(?:_[0-9]+)*)/i);
  if (osMatch && isAppleTouchDevice) {
    iosVerText = osMatch[1].replace(/_/g, ".");
  }

  let androidVer = null;
  if (isAndroid) {
    const m = ua.match(/Android\s+([0-9]+(?:\.[0-9]+)?)/i);
    if (m) androidVer = parseFloat(m[1]);
  }

  // 古い機能の有無
  const supportsWebAuthn = typeof window.PublicKeyCredential !== "undefined";
  const supportsInert = "inert" in HTMLElement.prototype;
  const likelyLegacyApple = isAppleTouchDevice && (!supportsWebAuthn || !supportsInert);

  let androidNfcChoice = null;
  let screenLockChoice = null;

  function buildLockHeaderHtml() {
    const setCls = screenLockChoice === "set" ? "active" : "";
    const unsetCls = screenLockChoice === "unset" ? "active" : "";
    let statusMsg = "画面ロックの申告：未選択（そのままでも進められます）";
    if (screenLockChoice === "set") {
      statusMsg = "画面ロック：設定済み（そのまま利用できます）";
    } else if (screenLockChoice === "unset") {
      statusMsg = "画面ロック：未設定（手続きの前にパスコード等の設定をご案内ください）";
    }
    return (
      '<div class="lock-gate">' +
        '<div><strong>画面ロック確認：</strong>パスコード、顔認証、指紋、PINコードはどれか設定していますか？</div>' +
        '<div class="btn-group">' +
          '<button type="button" id="btnLockSet" class="' + setCls + '" onclick="setScreenLock(\'set\')">設定している</button>' +
          '<button type="button" id="btnLockUnset" class="' + unsetCls + '" onclick="setScreenLock(\'unset\')">まだ／これから設定</button>' +
        '</div>' +
        '<div class="lock-status">' + statusMsg + '</div>' +
      '</div>'
    );
  }

  window.setScreenLock = function(val) {
    screenLockChoice = (screenLockChoice === val) ? null : val;
    render();
  };

  window.setNfc = function(val) {
    androidNfcChoice = val;
    document.getElementById("btnNfcYes").classList.toggle("active", val === "yes");
    document.getElementById("btnNfcNo").classList.toggle("active", val === "no");
    render();
  };

  function getAppleLabel() {
    if (hasRealIPadToken) return "iPad（PC版表示の可能性あり・要確認）";
    if (isDesktopModeMac && navigator.maxTouchPoints > 1) {
      return "iPhoneまたはiPad（デスクトップ表示／タッチ端末・要確認）";
    }
    if (hasRealIPhoneToken) return "iPhone";
    return "iOS端末（要確認）";
  }

  function render() {
    const badge = document.getElementById("resultBadge");
    const detail = document.getElementById("resultDetail");
    const nfcPrompt = document.getElementById("nfcPrompt");
    const uaInfo = document.getElementById("uaInfo");
    const lockHeader = buildLockHeaderHtml();

    badge.className = "badge";

    if (isAppleTouchDevice) {
      nfcPrompt.style.display = "none";
      const deviceLabel = getAppleLabel();
      const verDisp = iosVerText ? ("iOS / iPadOS " + iosVerText + "（目安）") : "バージョン非表示・目安確認";

      if (likelyLegacyApple) {
        badge.classList.add("warn");
        badge.textContent = "【確認しましょう】OS・表示設定のチェック";
        detail.innerHTML =
          lockHeader +
          "<strong>端末種別：</strong>" + deviceLabel + "<br>" +
          "<strong>OS目安：</strong>" + verDisp + "<br>" +
          "<strong>案内：</strong>少し前のバージョンの可能性があります。「設定 ＞ 一般 ＞ 情報 / ソフトウェアアップデート」と、Safariの「AA / 表示」からモバイル表示になっているか一緒に確認しましょう。";
      } else {
        badge.classList.add("ok");
        badge.textContent = "✨ ばっちり対応しています！（iPhone / iOS）";
        detail.innerHTML =
          lockHeader +
          "<strong>端末種別：</strong>" + deviceLabel + "<br>" +
          "<strong>OS目安：</strong>" + verDisp + "<br>" +
          "<strong>NFC（読取機能）：</strong>iPhone 7以降であれば搭載されています<br>" +
          "<strong>案内：</strong>準備OK！このスマホでそのまま手続きを進められます。（必要に応じて「設定 ＞ 一般 ＞ 情報」で正確なiOSバージョンも確認できます）";
      }
    } else if (isAndroid) {
      nfcPrompt.style.display = "block";
      const verText = androidVer ? ("Android " + androidVer + "（目安）") : "Android（バージョン不明）";
      if (androidNfcChoice === "no") {
        badge.classList.add("ng");
        badge.textContent = "【確認が必要です】NFC（カード読取）が見当たりません";
        detail.innerHTML =
          lockHeader +
          "<strong>OS目安：</strong>" + verText + "<br>" +
          "<strong>NFC：</strong>なし / 未確認<br>" +
          "<strong>案内：</strong>カード読み取りにはNFC機能が必要です。設定でNFCがオフになっていないか、または別の手続き方法を一緒に確認しましょう。";
      } else if (androidVer !== null && androidVer < 11) {
        badge.classList.add("warn");
        badge.textContent = "【確認しましょう】Androidのバージョンが古めです";
        detail.innerHTML =
          lockHeader +
          "<strong>OS目安：</strong>" + verText + "<br>" +
          "<strong>NFC：</strong>" + (androidNfcChoice === "yes" ? "あり" : "未選択") + "<br>" +
          "<strong>案内：</strong>少し前のバージョンのため、OSアップデートができるか、また別の方法で進められるかを一緒に確認しましょう。";
      } else if (androidNfcChoice === "yes") {
        if (androidVer !== null && androidVer === 11) {
          badge.classList.add("ok");
          badge.textContent = "👍 利用登録はばっちり対応しています！（Android 11）";
          detail.innerHTML =
            lockHeader +
            "<strong>OS目安：</strong>" + verText + "<br>" +
            "<strong>NFC：</strong>あり<br>" +
            "<strong>案内：</strong>利用登録はこのまま進められます！※スマホ搭載機能はAndroid 12以上が対象です。";
        } else {
          badge.classList.add("ok");
          badge.textContent = "✨ ばっちり対応しています！（Android）";
          detail.innerHTML =
            lockHeader +
            "<strong>OS目安：</strong>" + verText + "<br>" +
            "<strong>NFC：</strong>あり<br>" +
            "<strong>案内：</strong>準備OK！このスマホでそのまま進められます。";
        }
      } else {
        badge.classList.add("warn");
        badge.textContent = "【あと一歩】下の「NFC」ボタンを選んでください";
        detail.innerHTML =
          lockHeader +
          "<strong>OS目安：</strong>" + verText + "<br>" +
          "<strong>NFC：</strong>下の「NFCあり」「NFCなし / 不明」をタップすると判定が完了します。";
      }
    } else {
      nfcPrompt.style.display = "none";
      badge.classList.add("warn");
      badge.textContent = "【お願い】スマホの標準ブラウザで開いてください";
      detail.innerHTML =
        lockHeader +
        "現在はパソコンやアプリ内ブラウザで開かれています。iPhoneの「Safari」またはAndroidの「Chrome」でQRコードを読み取ってください。";
    }

    uaInfo.textContent = "ツール " + APP_VERSION + " / 識別情報: " + ua;
  }

  render();
})();
</script>
</body>
</html>
